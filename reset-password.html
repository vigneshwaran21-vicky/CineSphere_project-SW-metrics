<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .auth-container { max-width: 420px; margin: 90px auto 40px auto; background: transparent !important; border: none !important; box-shadow: none !important; }
        .auth-form { padding: 35px 30px; border-radius: 16px; background: #1a1a1e; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        .auth-input { width: 100%; padding: 12px 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #26262b; color: #fff; font-size: 15px; }
        .auth-input:focus { border-color: #f5c518; outline: none; box-shadow: 0 0 0 2px rgba(245,197,24,0.2); }
        .auth-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 700; border-radius: 8px; }
        .error-msg { color: #ff4d4d; margin-bottom: 15px; display: none; }
        .success-msg { color: #4CAF50; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo"><span class="logo-accent">Cine</span>Sphere</a>
        </div>
    </nav>
    <div class="container auth-container">
        <div style="text-align: left; margin-bottom: 15px;">
            <a href="login.html" style="color: #aaa; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#aaa'">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
        <div class="auth-form">
            <h2>Set New Password</h2>
            <br>
            <p style="font-size:14px; color:#ccc; margin-bottom:20px;">Enter your new password below to reset your account access.</p>
            <form id="resetForm">
                <input type="password" id="newPassword" class="auth-input" placeholder="New Password" required minlength="6">
                <input type="password" id="confirmPassword" class="auth-input" placeholder="Confirm New Password" required minlength="6">
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">Save Password</button>
            </form>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const btn = document.getElementById('submitBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if(!token) {
                UI.showToast("Invalid or missing token!", "error");
                return;
            }

            if(newPassword !== confirmPassword) {
                UI.showToast("Passwords do not match!", "error");
                return;
            }

            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            const res = await apiResetPasswordWithToken(token, newPassword);
            
            if(res.error) {
                UI.showToast(res.message, 'error');
                btn.innerHTML = 'Save Password';
                btn.disabled = false;
            } else {
                UI.showToast('Password updated successfully! You can now login.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        });
    </script>

    <script src="assets/js/chatbot.js"></script>
</body>
</html>
