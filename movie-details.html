<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | CineMatch</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body class="details-body">
    <!-- Navigation -->
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <span class="logo-accent">Cine</span>Sphere
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#movies">Movies</a></li>

                <li id="watchlistLink" style="display:none;"><a href="watchlist.html">Watchlist</a></li>
                <li id="authLink"><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user) {
                document.getElementById('authLink').innerHTML = `
                    <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                    <a href="javascript:void(0)" onclick="logout()" class="nav-logout"><i class="fas fa-sign-out-alt"></i></a>
                `;
                document.getElementById('watchlistLink').style.display = 'inline-block';
            }
        });
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>


    <!-- Movie Backdrop Hero -->
    <div id="movieBackdrop" class="details-hero" style="padding-top: 80px;">
        <div class="hero-overlay"></div>
        <div class="container" style="position:relative; z-index: 5; padding-top: 10px;">
            <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="btn btn-outline" style="margin-bottom: 12px; background: rgba(0,0,0,0.75); border: 1px solid var(--primary-color); backdrop-filter: blur(10px); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer;" onmouseenter="this.style.background='var(--primary-color)'; this.style.color='#000';" onmouseleave="this.style.background='rgba(0,0,0,0.75)'; this.style.color='#fff';">
                <i class="fas fa-arrow-left"></i> Back to Movies
            </button>
            <div class="details-hero-content">
                <div class="details-poster-wrapper glass-card">
                    <img id="detailPoster" src="" alt="">
                </div>
                <div class="details-info">
                <h1 id="detailTitle" class="hero-title"></h1>
                <div class="details-meta">
                    <span id="detailYear"></span> &bull;
                    <span id="detailDuration"></span> &bull;
                    <span id="detailGenre"></span>
                </div>
                
                <div class="details-buttons-row" style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="watchTrailerBtn" class="btn btn-primary"><i class="fas fa-video"></i> Watch Official Trailer</button>
                    <button id="addToWatchlistBtn" class="btn btn-outline" style="display:none;"><i class="fas fa-plus"></i> Add to Watchlist</button>
                    <a id="downloadPosterBtn" href="#" target="_blank" download class="btn glass-card"><i class="fas fa-image"></i> Download HD Poster</a>
                </div>

                <div class="details-rating-big">
                    <i class="fas fa-star text-primary"></i>
                    <span id="detailRating"></span> <span class="rating-max">/10</span>
                </div>
                <p id="detailDescription" class="hero-subtitle"></p>
                <div class="details-crew">
                    <div><strong>Director:</strong> <span id="detailDirector"></span></div>
                    <div><strong>Cast:</strong> <span id="detailCast"></span></div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <main class="container">
        <!-- Interactive Section -->
        <section class="section">
            <div class="grid-2-cols" id="reviewsGrid">
                <!-- Rating and Reviews Form (Only shown when Logged In) -->
                <div class="glass-card pd-2" id="rateReviewCard" style="display: none;">
                    <h2 class="section-title">Rate & Review</h2>
                    <div id="rateReviewFormBox">
                        <div class="user-rating-box" id="ratingInputBox">
                            <p>Share your thought on this movie:</p>
                            <div class="star-rating" id="starInput">
                                <i class="far fa-star" data-value="1"></i>
                                <i class="far fa-star" data-value="2"></i>
                                <i class="far fa-star" data-value="3"></i>
                                <i class="far fa-star" data-value="4"></i>
                                <i class="far fa-star" data-value="5"></i>
                                <i class="far fa-star" data-value="6"></i>
                                <i class="far fa-star" data-value="7"></i>
                                <i class="far fa-star" data-value="8"></i>
                                <i class="far fa-star" data-value="9"></i>
                                <i class="far fa-star" data-value="10"></i>
                            </div>
                            <span id="ratingTip" class="text-primary" style="font-weight: 600;">Rate it!</span>
                        </div>
                        <form id="reviewForm" class="review-form">
                            <textarea id="reviewText" placeholder="Write your review here..." required rows="4"></textarea>
                            <button type="submit" class="btn btn-primary">Submit Review</button>
                        </form>
                    </div>
                </div>

                <!-- Reviews List -->
                <div class="glass-card pd-2" id="userReviewsCard" style="grid-column: span 2;">
                    <h2 class="section-title">User Reviews</h2>
                    <div id="reviewsList" class="reviews-container">
                        <!-- Reviews injected here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Similar Movies Section -->
        <section id="similarMoviesSection" class="section" style="margin-top: 40px;">
            <h2 class="section-title">🎬 More Like This</h2>
            <div class="movie-grid" id="similarMovies">
                <!-- Similar movies injected here -->
            </div>
        </section>
    </main>

    <!-- Actor Details Modal -->
    <div id="actorModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(0,0,0,0.8); align-items: center; justify-content: center;">
        <div class="glass-card" style="position: relative; max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 25px;">
            <button onclick="document.getElementById('actorModal').style.display='none'" style="position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
            <div id="actorModalContent" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 CineMatch. Visualizing Cinema with Agile-ALM.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/api.js?v=40"></script>
    <script src="assets/js/ui.js?v=40"></script>
    <script src="assets/js/movies.js?v=40"></script>
    <script src="assets/js/state.js?v=40"></script>
    <script src="assets/js/details.js?v=40"></script>
    <script src="assets/js/chatbot.js?v=40"></script>
    <script src="assets/js/recommendations.js?v=40"></script>
    <script>
        // Integration script for Watchlist & Reviews
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('id');
            const user = JSON.parse(localStorage.getItem('user'));
            const rateCard = document.getElementById('rateReviewCard');
            const userReviewsCard = document.getElementById('userReviewsCard');

            if (movieId) {
                loadReviews(movieId);
            }

            if (user && movieId) {
                // LOGGED IN USER: Show the Rate & Review input form!
                if (rateCard) rateCard.style.display = 'block';
                if (userReviewsCard) userReviewsCard.style.gridColumn = 'auto';

                // Watchlist button
                const btn = document.getElementById('addToWatchlistBtn');
                if (btn) {
                    btn.style.display = 'inline-block';
                    btn.onclick = async () => {
                        const res = await apiAddToWatchlist(user.id, movieId);
                        if(res.error) UI.showToast(res.message, 'error');
                        else UI.showToast('Added to Watchlist!', 'success');
                    };
                }

                // Rating interaction
                const stars = document.querySelectorAll('#starInput i');
                let currentRating = 0;
                
                stars.forEach(star => {
                    star.addEventListener('mouseover', () => {
                        const val = parseInt(star.getAttribute('data-value'));
                        highlightStars(val);
                    });
                    star.addEventListener('mouseout', () => {
                        highlightStars(currentRating);
                    });
                    star.addEventListener('click', () => {
                        currentRating = parseInt(star.getAttribute('data-value'));
                        highlightStars(currentRating);
                        document.getElementById('ratingTip').textContent = `Rating: ${currentRating}/10`;
                    });
                });

                function highlightStars(val) {
                    stars.forEach(s => {
                        const sVal = parseInt(s.getAttribute('data-value'));
                        if(sVal <= val) {
                            s.classList.remove('far');
                            s.classList.add('fas');
                        } else {
                            s.classList.remove('fas');
                            s.classList.add('far');
                        }
                    });
                }

                // Form handling
                const form = document.getElementById('reviewForm');
                const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
                let isUpdate = false;

                async function checkExistingReview() {
                    const reviews = await apiGetReviews(movieId);
                    const myReview = reviews.find(r => r.user_id == user.id || r.user_name == user.name);
                    if (myReview && submitBtn) {
                        isUpdate = true;
                        currentRating = myReview.rating;
                        highlightStars(currentRating);
                        document.getElementById('ratingTip').textContent = `Your Rating: ${currentRating}/10`;
                        document.getElementById('reviewText').value = myReview.comment;
                        submitBtn.innerHTML = '<i class="fas fa-edit"></i> Update Review';
                    }
                }
                checkExistingReview();

                if (form) {
                    form.onsubmit = async (e) => {
                        e.preventDefault();
                        if (currentRating === 0) {
                            UI.showToast("Please select a star rating first!", "error");
                            return;
                        }
                        const text = document.getElementById('reviewText').value;
                        
                        const res = isUpdate 
                            ? await apiUpdateReview(user.id, movieId, text, currentRating)
                            : await apiAddReview(user.id, movieId, text, currentRating);
                        
                        if(res.error) {
                            UI.showToast("Error: " + (res.message || "Failed to submit review."), "error");
                        } else {
                            UI.showToast(isUpdate ? "Review updated successfully!" : "Review added successfully!", "success");
                            if(!isUpdate) {
                                document.getElementById('reviewText').value = '';
                                currentRating = 0;
                                highlightStars(0);
                                document.getElementById('ratingTip').textContent = 'Rate it!';
                            }
                            await loadReviews(movieId);
                            await checkExistingReview();
                        }
                    };
                }

            } else {
                // LOGGED OUT USER:
                // Do NOT show the review input form!
                if (rateCard) {
                    rateCard.style.display = 'none';
                }
                if (userReviewsCard) {
                    userReviewsCard.style.gridColumn = 'span 2';
                }

                const btn = document.getElementById('addToWatchlistBtn');
                if (btn) {
                    btn.style.display = 'inline-block';
                    btn.onclick = () => {
                        UI.showToast("Please log in first to manage your watchlist!", "error");
                        if (typeof UI !== 'undefined' && UI.showAuthAlert) UI.showAuthAlert('Watchlist');
                    };
                }
            }
        });

        async function loadReviews(movieId) {
            const list = await apiGetReviews(movieId);
            const container = document.getElementById('reviewsList');
            if (!container) return;
            if(!list || list.length === 0) {
                container.innerHTML = '<p class="text-muted" style="padding: 10px 0;">No reviews yet for this movie.</p>';
            } else {
                container.innerHTML = list.map(r => {
                    let starsHtml = '';
                    for(let i=1; i<=10; i++) {
                        starsHtml += i <= r.rating ? '<i class="fas fa-star" style="color:#fbc02d; font-size:12px;"></i>' : '<i class="far fa-star" style="color:#555; font-size:12px;"></i>';
                    }
                    return `
                        <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong>${r.user_name || 'Anonymous User'}</strong>
                                <div>${starsHtml}</div>
                            </div>
                            <small style="color:#aaa;">${r.created_at || ''}</small>
                            <p style="margin-top:8px; line-height:1.5; color:#ddd;">${r.comment}</p>
                        </div>
                    `;
                }).join('');
            }
        }
    </script>
</body>
</html>
